[project]
name = "hypothesis-grammar-assignment"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "hypothesis>=6.152.7",
    "pytest>=9.0.3",
    "pytest-html>=4.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--html=reports/pytest_html/index.html --self-contained-html --capture=tee-sys"
testpaths = ["tests"]